<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audiobasics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Courier New', Courier, monospace;
    color: #1a1a1a;
  }
  body {
    background-image: url('/assets/404-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
  }
  .icon {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #fff;
    margin-top: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .blurb {
    margin-top: 32px;
    background: rgba(120,120,120,0.55);
    color: #fff;
    padding: 20px 28px;
    border-radius: 8px;
    max-width: 320px;
    font-weight: bold;
    line-height: 1.5;
  }
  .spacer { flex-grow: 1; min-height: 80px; }
  .get-btn {
    display: inline-block;
    background: #e63946;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 22px;
    padding: 16px 40px;
    border-radius: 12px;
    margin-top: 40px;
  }
  .get-sub { margin-top: 8px; color: #333; font-size: 14px; }
  .yt-link {
    display: inline-block;
    margin-top: 32px;
    color: #e63946;
    text-decoration: underline;
    font-size: 24px;
    font-weight: bold;
  }
  .footer { margin-top: auto; margin-bottom: 32px; padding-top: 64px; }
  .footer a { color: #3a4d8f; text-decoration: underline; font-size: 14px; }

  /* Plain 404 state — anything that isn't a /l/... Audiobasics Link falls through to this,
     so the rest of the site's normal "page not found" behavior is unaffected. */
  .plain-404 { margin-top: 120px; font-size: 20px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .plain-404 a { color: #fff; text-decoration: underline; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div id="linkCard" hidden>
    <div class="icon"><img src="/assets/icon.png" alt="Audiobasics" /></div>

    <div class="blurb">
      Audiobasics is a free open source and lightweight music streaming client.<br />
      It's available on GitHub.
    </div>

    <div class="spacer"></div>

    <a class="get-btn" href="https://github.com/raktim-basic/Audiobasics">Get Audiobasics</a>
    <div class="get-sub">github</div>

    <a class="yt-link" id="ytLink" href="https://www.youtube.com">Open in YouTube</a>

    <div class="footer">
      <a href="https://github.com/raktim-basic">raktim-basic</a>
    </div>
  </div>

  <div id="plain404" class="plain-404" hidden>
    404 — page not found.<br /><br />
    <a href="/">Back home</a>
  </div>

  <script>
    // This file is GitHub Pages' catch-all for any URL that isn't a real file — it doubles as
    // both the Audiobasics smart-link router (for /l/song/<id> and /l/album/<id>) and the
    // site's normal 404 page for everything else. Real pages/files on the site are served
    // directly by GitHub Pages and never reach this script at all.
    (function () {
      var segments = window.location.pathname.split('/').filter(Boolean);
      var isLinkPath = segments[0] === 'l' && segments.length >= 3 &&
        (segments[1] === 'song' || segments[1] === 'album');

      if (isLinkPath) {
        var type = segments[1];
        var id = segments[2];
        var link = document.getElementById('ytLink');
        link.href = type === 'song'
          ? 'https://www.youtube.com/watch?v=' + encodeURIComponent(id)
          : 'https://www.youtube.com/playlist?list=' + encodeURIComponent(id);
        document.getElementById('linkCard').hidden = false;
      } else {
        document.getElementById('plain404').hidden = false;
      }
    })();
  </script>
</body>
</html>
